<!DOCTYPE html>
<html>
<head>
  <title>My Block Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 12px;
      border-radius: 8px;
      z-index: 10;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 25px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="info">
  <b>MY BLOCK GAME</b><br>
  WASD = Move<br>
  Mouse = Look<br>
  Click = Break block
</div>

<div id="crosshair">+</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { PointerLockControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

// Camera
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 3, 8);

// Renderer
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
const light = new THREE.HemisphereLight(
  0xffffff,
  0x555555,
  3
);

scene.add(light);

// Controls
const controls = new PointerLockControls(
  camera,
  document.body
);

document.body.addEventListener("click", () => {
  controls.lock();
});

// Block materials
const grass = new THREE.MeshLambertMaterial({
  color: 0x45a832
});

const dirt = new THREE.MeshLambertMaterial({
  color: 0x8b5a2b
});

// Blocks
const blocks = [];

function createBlock(x, y, z, material) {

  const geometry = new THREE.BoxGeometry(1, 1, 1);

  const block = new THREE.Mesh(
    geometry,
    material
  );

  block.position.set(x, y, z);

  scene.add(block);
  blocks.push(block);

}

// Ground
for (let x = -10; x <= 10; x++) {

  for (let z = -10; z <= 10; z++) {

    createBlock(x, 0, z, grass);
    createBlock(x, -1, z, dirt);

  }

}

// Random blocks
for (let i = 0; i < 20; i++) {

  const x = Math.floor(Math.random() * 16) - 8;
  const z = Math.floor(Math.random() * 16) - 8;

  createBlock(x, 1, z, grass);

}

// Movement
const keys = {};

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function movePlayer() {

  const speed = 0.08;

  if (keys["w"]) controls.moveForward(speed);
  if (keys["s"]) controls.moveForward(-speed);
  if (keys["a"]) controls.moveRight(-speed);
  if (keys["d"]) controls.moveRight(speed);

}

// Break blocks
const raycaster = new THREE.Raycaster();

document.addEventListener("mousedown", () => {

  if (!controls.isLocked) return;

  raycaster.setFromCamera(
    new THREE.Vector2(0, 0),
    camera
  );

  const hits = raycaster.intersectObjects(blocks);

  if (hits.length > 0) {

    const block = hits[0].object;

    scene.remove(block);

    const index = blocks.indexOf(block);

    if (index !== -1) {
      blocks.splice(index, 1);
    }

  }

});

// Resize
window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

// Game loop
function animate() {

  requestAnimationFrame(animate);

  movePlayer();

  renderer.render(scene, camera);

}

animate();

</script>

</body>
</html>
